 ["PREFACE",'<p class="k">NORAD // W.O.P.R. DIVISION\nOPERATOR MANUAL // MODEL 80-04\nCLASSIFICATION: RESTRICTED</p><p>THIS TERMINAL SIMULATES A 10 x 20 CONTAINMENT MATRIX. BLOCKS ARE DELIVERED FROM ABOVE. ARRANGE THEM. A COMPLETE ROW IS ERASED FROM THE RECORD.</p><p>IF THE STACK REACHES THE TOP, THE SESSION IS ████████████ AND AN INCIDENT IS FILED.</p><p>MARATHON - NO LIMIT. SPEED RISES EVERY 10 LINES.\nSPRINT 40 - CLEAR 40 LINES AS FAST AS POSSIBLE.</p><p>THE OPERATOR IS ADVISED THAT THIS TERMINAL WAS DESIGNED BY A MACHINE THAT DOES NOT DISTINGUISH BETWEEN A GAME AND ███████████████.</p>'],

 ["SCORING",'<p>SINGLE 100 / DOUBLE 300 / TRIPLE 500 / TETRIS 800 (x LEVEL)</p><p>T-SPIN: ROTATE A TEEWEE INTO A TIGHT SLOT. 400 / 800 / 1200 / 1600.</p><p>BACK-TO-BACK TETRIS OR T-SPIN: x1.5.\nCOMBO: +50 x COMBO x LEVEL.\nPERFECT CLEAR: UP TO 2000 BONUS.</p><p>LOCK DELAY: A LANDED PIECE LOCKS AFTER HALF A SECOND. ONLY REACHING A NEW LOWEST ROW RESETS IT.</p>'],
 ["CONTROL POWER",'<p>THE POWER METER DRAINS CONSTANTLY. CLEARING ROWS RESTORES IT:\n1 ROW 4% / 2 ROWS 10% / 3 ROWS 18% / 4 ROWS 32%.</p><p>THE DRAIN GROWS WITH LEVEL, TIME PLAYED, EVERY SCRAM AND THE HEIGHT OF YOUR STACK. WHEN POWER IS RESTORED AFTER A SCRAM IT RETURNS TO 65%, AND THE CELLS HOLD STEADY FOR 8 SECONDS.</p><p>THERE ARE NO WARNINGS. AS POWER FAILS THE DISPLAY DIMS, FLICKERS AND THE EDGES CLOSE IN. A HEARTBEAT BEGINS. LISTEN FOR IT.</p><p>AT 0%: REACTOR SCRAM. THE MATRIX KEEPS FALLING, MORE SLOWLY STILL, WHILE YOU RESTORE POWER BY HAND.</p><p>LOW POWER NEVER LOCKS YOUR CONTROLS. IT ONLY WATCHES YOU.</p>'],
 ["DEFCON STATUS",'<p>DEFCON 5 ..... POWER 75-100%. NOMINAL.\nDEFCON 4 ..... POWER 50-75%. DISPLAY STABLE.\nDEFCON 3 ..... POWER 25-50%. DISPLAY DIMS.\nDEFCON 2 ..... POWER 0-25%. DISPLAY FLICKERS.\nDEFCON 1 ..... REACTOR SCRAM.</p><p>THE CURRENT LEVEL IS SHOWN IN THE STATUS BAR.</p><p>DEFCON 1 IS A STATE OF ██████████. DO NOT REMAIN THERE LONGER THAN NECESSARY.</p>'],
 ["SCRAM PROTOCOLS",'<p><span class="k">COOLANT</span> MASH SPACE FASTER THAN PRESSURE BLEEDS OFF.\n<span class="k">TARGETING</span> AIM (ARROWS OR MOUSE). FIRE ON THE NAMED CITY (3x).\n<span class="k">BREAKERS</span> PRESS THE ARROW SHOWN BEFORE IT TRIPS (8x).\n<span class="k">CABLE</span> ARROWS OR DRAG. ROUTE THE CABLE AROUND THE BLOCKED CELLS.\n<span class="k">ISOLATION</span> READ THE RULE. CLICK THE RIGHT WIRE, OR PRESS 1-4 (2x).\n<span class="k">SWEEP</span> CLICK EVERY CORRUPT SECTOR [X] BEFORE TIME RUNS OUT.</p><p>TWO PROTOCOLS ARE ISSUED THE FIRST TIME. THREE AFTER THAT. THE MATRIX KEEPS FALLING WHILE YOU WORK.</p><p>ONE PAGE FOLLOWS FOR EACH PROTOCOL. WHEN ALL ARE DONE, POWER RETURNS AT 65%.</p>'],
 ["PROTOCOL 1: COOLANT PUMP",'<p class="k">COOLANT PUMP // FILL THE BAR</p><p>THE REACTOR OVERHEATS. FILL THE PRESSURE BAR TO 100%.</p><p><kbd>SPACE</kbd> OR TAP PUMP. EACH PRESS ADDS 9%.\nTHE BAR LEAKS 18% EVERY SECOND, AND LEAKS FASTER AFTER EVERY SCRAM.\nNO TIMER. NO PENALTY. ONLY SPEED.</p><p class="k">MASH. DO NOT STOP MASHING.</p>'],
 ["PROTOCOL 2: TARGETING",'<p class="k">TARGETING // 3 HITS</p><p>A CITY NAME IS SHOWN. PUT THE CROSSHAIR ON ITS MARKER AND FIRE.</p><p>AIM: ARROW KEYS, OR MOVE THE MOUSE.\nFIRE: <kbd>SPACE</kbd>, OR CLICK / TAP THE MAP. A TAP AIMS AND FIRES AT ONCE.\nTHE CROSSHAIR MUST BE CLOSE TO THE MARKER.</p><p>TARGET WINDOW: 10 SECONDS, 0.5 LESS AFTER EVERY SCRAM, NEVER BELOW 6.\nA MISS OR A CLOSED WINDOW COSTS ONE HIT AND ISSUES A NEW TARGET.</p>'],
 ["PROTOCOL 3: BREAKERS",'<p class="k">BREAKER PANEL // 8 HITS</p><p>A LARGE ARROW APPEARS. PRESS THE SAME ARROW, OR TAP THE BUTTON.</p><p>CONTROLS: ARROW KEYS OR W A S D.\nTIME PER BREAKER: 1.8 SECONDS. IT SHRINKS WITH EVERY SCRAM AND EVERY CORRECT HIT. FLOOR 0.8.\nA WRONG ARROW OR A TRIPPED BREAKER COSTS TWO HITS.</p><p class="k">DO NOT LOOK AT THE KEYS.</p>'],

 ["PROTOCOL 5: ISOLATION",'<p class="k">ISOLATION // 2 CUTS</p><p>FOUR WIRES ARE NUMBERED 1 TO 4, TOP TO BOTTOM. ONE RULE IS SHOWN. CUT THE WIRE IT NAMES.</p><p>CUT: CLICK THE WIRE, OR PRESS <kbd>1</kbd> TO <kbd>4</kbd>.\nARROWS AND <kbd>SPACE</kbd> ALSO WORK.\nWIRE STYLES: SOLID, DASHED, DOTTED, DOUBLE.\nRULES: CUT THE (STYLE) WIRE / CUT ABOVE THE (STYLE) WIRE / CUT BELOW THE (STYLE) WIRE / CUT THE TOP WIRE / CUT THE BOTTOM WIRE.</p><p>TIME PER RULE: 9.5 SECONDS, 0.5 LESS AFTER EVERY SCRAM, NEVER BELOW 6.5.\nA WRONG CUT OR A SLOW ONE COSTS ONE CUT AND ISSUES A NEW RULE.</p>'],
 ["PROTOCOL 6: MEMORY SWEEP",'<p class="k">MEMORY SWEEP // CLEAR ALL</p><p>CORE MEMORY IS A GRID OF 32 SECTORS. SOME ARE CORRUPT, SHOWN AS A BOXED X. CLEAR EVERY ONE.</p><p>CLEAR: CLICK OR TAP A SECTOR. OR MOVE WITH THE ARROWS AND PRESS <kbd>SPACE</kbd>.\nORDER DOES NOT MATTER. NOTHING PLAYS BACK. THERE IS NOTHING TO WAIT FOR.\n6 SECTORS ARE CORRUPT, ONE MORE AFTER EVERY SCRAM, UP TO 9.</p><p>TIME: 12 SECONDS, 0.6 LESS AFTER EVERY SCRAM, NEVER BELOW 8.\nCLEARING A CLEAN SECTOR COSTS 1.5 SECONDS. IF TIME RUNS OUT THE SWEEP RESTARTS.</p><p class="k">FASTEST HANDS WIN.</p>'],
 ["THE HOTLINE",'<p>A PRIORITY CALL FROM THE NATIONAL COMMAND LINE RINGS WITHOUT WARNING. THE LINE RINGS FOR ONLY 8.75 SECONDS. PRESS <kbd>H</kbd> OR TAP ANSWER BEFORE IT GOES DEAD.</p><p>THE GAME FREEZES WHILE YOU TALK. YOU HAVE 10 SECONDS TO GIVE ONE ORDER:\n<kbd>1</kbd> RESERVE POWER: +35% POWER. DRAIN x1.35 FOR 30s.\n<kbd>2</kbd> STAND DOWN: GRAVITY HALVED FOR 20s. POWER -10%.\n<kbd>3</kbd> ESCALATE: SCORE x2 FOR 30s. DRAIN x1.6 FOR 30s.</p><p>UNANSWERED: THE CALL IS DEAD. POWER -15%, DRAIN x1.4 FOR 30s.\nNO ORDER GIVEN: POWER -8%.</p><p>THE LINE IS NEVER ████████.</p>'],
 ["JOSHUA // DETONATION",'<p>THE W.O.P.R. SUPERCOMPUTER PLAYS TOO. FROM LEVEL 2 IT CONNECTS WITHOUT WARNING AND A PHANTOM BLOCK FALLS THROUGH YOUR MATRIX.</p><p>WHEN IT LANDS, JOSHUA PUSHES ONE ROW OF DEBRIS UP FROM BELOW. THE GAP IS WHERE THE PHANTOM FELL.\nIT PLAYS FASTER AS YOUR LEVEL RISES. PURGE REMOVES ITS WORK.</p><p>A TETRIS IS A DETONATION. THE DISPLAY FLASHES AND A CLOUD RISES OVER THE MATRIX. A PERFECT CLEAR IS A LARGER YIELD.</p><p>JOSHUA HAS RUN THIS SIMULATION FOUR MILLION TIMES. IT HAS NOT YET ████████.</p>'],
 ["N1 LAUNCH: OVERVIEW",'<p class="k">SECTION N // FOR OPERATOR EDUCATION</p><p>DETERRENCE RESTS ON ONE IDEA: ANY ATTACK WILL BE ANSWERED. THE RESPONSE MUST BE FAST ENOUGH TO SURVIVE A FIRST STRIKE AND SURE ENOUGH THAT NO ONE TRIES.</p><p>THE SYSTEM HAS THREE JOBS:\nDETECT - RADAR AND SATELLITES WATCH THE SKY.\nDECIDE - ONLY THE NATIONAL COMMAND AUTHORITY MAY ORDER USE.\nDELIVER - THE TRIAD CARRIES OUT THE ORDER.</p><p>EVERY STEP IS DESIGNED SO THAT NO SINGLE PERSON CAN BEGIN A WAR. EVERY STEP IS ALSO DESIGNED TO BE ████████ UNDER PRESSURE.</p>'],

 ["N3 CHAIN OF COMMAND",'<p>NORAD ........ DETECTS AND WARNS (CHEYENNE MOUNTAIN, COLORADO)\nNMCC .......... NATIONAL MILITARY COMMAND CENTER (THE PENTAGON)\nPRESIDENT ..... THE ONLY AUTHORITY TO ORDER USE\nSAC ........... STRATEGIC AIR COMMAND (OFFUTT AFB, NEBRASKA)\nMISSILE WINGS . CONTROL THE SILO FIELDS\nLAUNCH CREWS .. TWO OFFICERS PER CONTROL CAPSULE</p><p>AN EMERGENCY ACTION MESSAGE (EAM) CARRIES THE ORDER DOWN THE CHAIN. IT IS AUTHENTICATED AT EACH STEP.</p><p>THE CHAIN WAS BUILT TO WORK WHEN HALF OF IT IS ██████████.</p>'],
 ["N4 LAUNCH SEQUENCE",'<p>1. ALERT: THE EAM ARRIVES. KLAXON.\n2. DECODE: THE CREW DECODES THE MESSAGE.\n3. AUTHENTICATE: THE CODE IS CHECKED AGAINST A SEALED AUTHENTICATOR KEPT IN A LOCKED SAFE.\n4. ENABLE: LAUNCH CODES AND THE TARGET SET ARE ENABLED.\n5. KEYS: TWO OFFICERS, SEATED APART, TURN THEIR KEYS AT THE SAME INSTANT.\n6. CONFIRM: ANOTHER CONTROL CENTER MUST AGREE.\n7. LAUNCH.</p><p>THE KEYS ARE PLACED FAR APART ON PURPOSE. ONE PERSON CANNOT REACH BOTH.</p><p class="k">THIS IS THE SEQUENCE YOU PERFORM DURING A SCRAM. THE TERMINAL IS ████████ YOU.</p>'],

 ["N9 FLIGHT TIMES",'<p>ICBM, OVER THE POLE ........ ABOUT 30 MIN\nSLBM, FROM OFFSHORE ........ 10-15 MIN\nPERSHING II, FROM EUROPE ... UNDER 10 MIN</p><p>WARNING TIME IS THE ENEMY. SATELLITES SEE THE LAUNCH. RADAR SEES THE ARRIVAL. THE LAST DECISIONS MAY HAVE TO BE MADE IN MINUTES.</p><p>THIS IS WHY THE HOTLINE EXISTS. IT IS NOT FOR CONVERSATION. IT IS FOR ████████.</p>'],
 ["N10 SAFEGUARDS",'<p><span class="k">PAL</span> PERMISSIVE ACTION LINKS. ELECTRONIC LOCKS ON WARHEADS. WITHOUT THE CORRECT CODE THE WEAPON WILL NOT DETONATE.\n<span class="k">TWO-PERSON RULE</span> NO ONE MAY BE ALONE WITH A WEAPON OR ITS CODES.\n<span class="k">SEALED CODES</span> KEPT SEPARATE FROM THE KEYS.\n<span class="k">SCREENING</span> CREWS ARE TESTED, THEN TESTED AGAIN.</p><p>EVERY SAFEGUARD ADDS ONE MORE PERSON WHO MUST SAY YES. EVERY SAFEGUARD ADDS ONE MORE ████████.</p>'],
